<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tendo Bakery - Checkout</title>
</head>
<body>
    <header>
        <h1>Tendo Bakery</h1>
    </header>
     <link rel="stylesheet" href="style.css">   
    <nav>
         <a href="index.html">Checkout</a> | 
        <a href="Category.html">Category</a> | 
        <a href="Custom.html">Custom</a> | 
        <a href="Account.html">Account</a> | 
        <a href="Homepage.html">Home</a>
    </nav>
    
    <main>
        <div id="checkout-box">
            <h2>Checkout</h2>
            
            <div id="category-data"></div>
            <div id="custom-data"></div>

            <br><br>
            <button onclick="cancelOrder()">Cancel order</button>
            <button onclick="confirmOrder()">confirm order</button>
        </div>

        <div id="thanks-box" style="display: none;">
            <h2>thank you for ordering.</h2>
        </div>
    </main>

    <script>
        function showData() {
            // Read Category selections
            let catOrders = JSON.parse(localStorage.getItem('categoryOrders')) || {};
            let catDiv = document.getElementById('category-data');
            let catText = "";
            
            Object.keys(catOrders).forEach(cat => {
                Object.keys(catOrders[cat]).forEach(flavor => {
                    let num = catOrders[cat][flavor];
                    if (num > 0) {
                        catText += "<p>" + cat + " - " + flavor + ": " + num + "</p>";
                    }
                });
            });
            catDiv.innerHTML = catText;

            // Read Custom text box entries
            let custOrders = JSON.parse(localStorage.getItem('customOrders')) || {};
            let custDiv = document.getElementById('custom-data');
            let custText = "";
            
            Object.keys(custOrders).forEach(cat => {
                if (custOrders[cat] !== "") {
                    custText += "<p>" + cat + ": " + custOrders[cat] + "</p>";
                }
            });
            custDiv.innerHTML = custText;
        }

        function cancelOrder() {
            localStorage.removeItem('categoryOrders');
            localStorage.removeItem('customOrders');
            showData();
        }

        function confirmOrder() {
            document.getElementById('checkout-box').style.display = 'none';
            document.getElementById('thanks-box').style.display = 'block';
        }

        window.onload = showData;
    </script>
</body>
</html>
