<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tendo Bakery - Account</title>
</head>
<body>
    <header>
        <h1>Tendo Bakery</h1>
    </header>
      <link rel="stylesheet" href="style.css">  
    <nav>
        <a href="index.html">Account</a> | 
        <a href="category.html">Category</a> | 
        <a href="custom.html">Custom</a> | 
        <a href="Homepage.html">Homepage</a> | 
        <a href="checkout.html">Checkout</a>
    </nav>
    
    <main>
        <h2>User Account Hub</h2>
        
        <div>
            <a href="checkout.html">
                <button>My Order</button>
            </a>
            
            <button onclick="showInvoiceForm()">My Account</button>
        </div>

        <div id="invoice-box" style="display: none;">
            <h3>Invoice Profile Authorization</h3>
            <div>
                <label>Gmail Address:</label>
                <input type="email" id="acc-gmail" placeholder="name@gmail.com">
            </div>
            <br>
            <div>
                <label>Password:</label>
                <input type="password" id="acc-pass" placeholder="••••••••">
            </div>
            <br>
            <button onclick="saveAccountAndRedirect()">Save Credentials & Return Home</button>
        </div>
    </main>

    <script>
        function showInvoiceForm() {
            let user = JSON.parse(localStorage.getItem('userProfile')) || {gmail:'', password:''};
            document.getElementById('acc-gmail').value = user.gmail;
            document.getElementById('acc-pass').value = user.password;
            document.getElementById('invoice-box').style.display = 'block';
        }

        function saveAccountAndRedirect() {
            let gmailVal = document.getElementById('acc-gmail').value;
            let passVal = document.getElementById('acc-pass').value;
            
            localStorage.setItem('userProfile', JSON.stringify({gmail: gmailVal, password: passVal}));
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
