<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tendo Bakery - Category</title>
</head>
<body>
    <header>
        <h1>Tendo Bakery</h1>
    </header>
    
    <nav>
        <a href="index.html">Home</a> | 
        <a href="Homepage.html">Category</a> | 
        <a href="custom.html">Custom</a> | 
        <a href="account.html">Account</a> | 
        <a href="checkout.html">Checkout</a>
    </nav>
    
    <main>
        <h2>Our Bakery Categories</h2>
        
        <div>
            <div id="cat-Cakes" onclick="openFlavorsTable('Cakes')">
                <img src="cakes.jpeg" width="150"></img>
                <h3>Cakes</h3>
            </div>
            <div id="cat-Cupcakes" onclick="openFlavorsTable('Cupcakes')">
                <img src="cupcakes.jpeg" width="150"></img>
                <h3>Cupcakes</h3>
            </div>
            <div id="cat-Muffins" onclick="openFlavorsTable('Muffins')">
                <img src="muffins.jpeg" width="150"></img>
                <h3>Muffins</h3>
            </div>
            <div id="cat-Cinnamon" onclick="openFlavorsTable('Cinnamon rolls')">
                <img src="cinnamon rolls.jpeg" width="150"></img>
                <h3>Cinnamon rolls</h3>
            </div>
        </div>

        <div id="category-sub-panel" style="display: none;">
            <h3>Flavors for <span id="active-cat-label"></span></h3>
            <table border="1">
                <thead>
                    <tr>
                        <th>Flavor</th>
                        <th>Select Quantity</th>
                    </tr>
                </thead>
                <tbody id="flavors-tbody"></tbody>
            </table>
            <p >Quantity configuration saved!</p>
        </div>
    </main>

    <script>
        let selectedCategory = "";
        const flavors = ["Vanilla", "chocolate", "chocolate chipped", "caramel", "raspberries"];

        function openFlavorsTable(catName) {
            selectedCategory = catName;
            document.getElementById('active-cat-label').innerText = catName;
            
            let tbodyHtml = "";
            let storedData = JSON.parse(localStorage.getItem('categoryOrders')) || {};
            let currentCatOrders = storedData[selectedCategory] || {};

            flavors.forEach(flavor => {
                let currentQty = currentCatOrders[flavor] || 0;
                tbodyHtml += `<tr>
                    <td>${flavor}</td>
                    <td>
                        <button onclick="saveQty('${flavor}', 1)">1</button>
                        <button onclick="saveQty('${flavor}', 2)">2</button>
                        <button onclick="saveQty('${flavor}', 3)">3</button>
                        <button onclick="saveQty('${flavor}', 4)">4</button>
                    </td>
                </tr>`;
            });
            document.getElementById('flavors-tbody').innerHTML = tbodyHtml;
            document.getElementById('category-sub-panel').style.display = 'block';
        }

        function saveQty(flavor, qty) {
            let storedData = JSON.parse(localStorage.getItem('categoryOrders')) || {};
            if (!storedData[selectedCategory]) storedData[selectedCategory] = {};
            storedData[selectedCategory][flavor] = qty;
            
            localStorage.setItem('categoryOrders', JSON.stringify(storedData));
            
            let toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        }
    </script>
</body>
</html>
